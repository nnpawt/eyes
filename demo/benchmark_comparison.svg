<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="torch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c92a2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="trt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a9d8f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">
    YOLO26 Benchmark: PyTorch vs TensorRT
  </text>
  
  <!-- Y-axis label -->
  <text x="20" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" transform="rotate(-90, 20, 250)" fill="#333">
    Inference Time (ms)
  </text>
  
  <!-- Grid lines -->
  <line x1="50" y1="450" x2="750" y2="450" stroke="#ddd" stroke-width="1"/>
  <line x1="50" y1="350" x2="750" y2="350" stroke="#ddd" stroke-width="1"/>
  <line x1="50" y1="250" x2="750" y2="250" stroke="#ddd" stroke-width="1"/>
  <line x1="50" y1="150" x2="750" y2="150" stroke="#ddd" stroke-width="1"/>
  <line x1="50" y1="50" x2="750" y2="50" stroke="#ddd" stroke-width="1"/>
  
  <!-- Y-axis labels -->
  <text x="40" y="454" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#666">0</text>
  <text x="40" y="354" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#666">5</text>
  <text x="40" y="254" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#666">10</text>
  <text x="40" y="154" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#666">15</text>
  <text x="40" y="54" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#666">20</text>
  
  <!-- PyTorch bars -->
  <rect x="100" y="380" width="80" height="70" fill="url(#torch)" rx="5"/>
  <rect x="250" y="310" width="80" height="140" fill="url(#torch)" rx="5"/>
  <rect x="400" y="230" width="80" height="220" fill="url(#torch)" rx="5"/>
  <rect x="550" y="200" width="80" height="250" fill="url(#torch)" rx="5"/>
  <rect x="700" y="160" width="80" height="290" fill="url(#torch)" rx="5"/>
  
  <!-- TensorRT bars -->
  <rect x="100" y="420" width="80" height="30" fill="url(#trt)" rx="5"/>
  <rect x="250" y="370" width="80" height="80" fill="url(#trt)" rx="5"/>
  <rect x="400" y="320" width="80" height="130" fill="url(#trt)" rx="5"/>
  <rect x="550" y="290" width="80" height="160" fill="url(#trt)" rx="5"/>
  <rect x="700" y="250" width="80" height="200" fill="url(#trt)" rx="5"/>
  
  <!-- Bar labels -->
  <text x="140" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">n</text>
  <text x="290" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">s</text>
  <text x="440" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">m</text>
  <text x="590" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">l</text>
  <text x="740" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">x</text>
  
  <!-- Legend -->
  <rect x="550" y="100" width="20" height="20" fill="url(#torch)" rx="5"/>
  <text x="575" y="115" font-family="Arial, sans-serif" font-size="12" fill="#333">PyTorch</text>
  
  <rect x="550" y="130" width="20" height="20" fill="url(#trt)" rx="5"/>
  <text x="575" y="145" font-family="Arial, sans-serif" font-size="12" fill="#333">TensorRT</text>
  
  <!-- Speedup indicator -->
  <rect x="550" y="170" width="180" height="30" fill="#f6e8c2" rx="5"/>
  <text x="570" y="190" font-family="Arial, sans-serif" font-size="12" fill="#333">
    <tspan font-weight="bold">~2.1x Speedup</tspan>
  </text>
  
  <!-- X-axis label -->
  <text x="400" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    YOLO26 Model Scale
  </text>
</svg>
